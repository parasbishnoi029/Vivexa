  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-white font-sans">
    <style>
        /* Premium Initial Loader CSS */
        #initial-loader {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: #030712;
          color: #f1f5f9;
          font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          overflow: hidden;
        }
        
        .glow-layer-1 {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 50vw;
          height: 50vw;
          max-width: 600px;
          max-height: 600px;
          background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
          pointer-events: none;
        }

        .loader-brand {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-bottom: 32px;
          z-index: 10;
        }

        .loader-logo-container {
          position: relative;
          width: 56px;
          height: 56px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .loader-logo {
          width: 100%;
          height: 100%;
          animation: spin-slow 8s linear infinite;
        }

        .loader-logo-inner {
          position: absolute;
          width: 50%;
          height: 50%;
          animation: pulse-inner 2s ease-in-out infinite;
        }

        .loader-title {
          font-size: 32px;
          font-weight: 700;
          letter-spacing: -0.03em;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        
        .loader-badge {
          font-size: 12px;
          font-weight: 600;
          padding: 4px 10px;
          border-radius: 9999px;
          background-color: rgba(99, 102, 241, 0.1);
          color: #818cf8;
          border: 1px solid rgba(99, 102, 241, 0.25);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .progress-track {
          width: 240px;
          height: 3px;
          background-color: rgba(255, 255, 255, 0.08);
          border-radius: 4px;
          overflow: hidden;
          z-index: 10;
        }

        .progress-fill {
          width: 40%;
          height: 100%;
          background: linear-gradient(90deg, transparent, #818cf8, transparent);
          border-radius: 4px;
          animation: indeterminate 1.8s infinite ease-in-out;
        }

        .loader-status {
          margin-top: 20px;
          font-size: 14px;
          color: #94a3b8;
          font-weight: 500;
          z-index: 10;
          letter-spacing: 0.02em;
          animation: pulse-text 2s infinite;
        }

        @keyframes spin-slow {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes pulse-inner {
          0%, 100% { transform: scale(0.8); opacity: 0.5; }
          50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.8)); }
        }

        @keyframes indeterminate {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        
        @keyframes pulse-text {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
    </style>

    <div id="initial-loader">
      <div class="glow-layer-1"></div>
      <div class="loader-brand">
        <div class="loader-logo-container">
          <svg class="loader-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
          <svg class="loader-logo-inner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="#818cf8"/>
          </svg>
        </div>
        <div class="loader-title">Vivexa <span class="loader-badge">OS</span></div>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="loader-status">Initializing AI Intelligence Core...</div>
    </div>

    <script>
      (function() {
        var loader = document.getElementById('initial-loader');
        function dismiss() {
          if (!loader || loader.getAttribute('data-dismissed')) return;
          loader.setAttribute('data-dismissed', 'true');
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1)';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 350);
        }
        window.__dismissLoader = dismiss;
        
        // Auto-dismiss safety timer (1.2 seconds max) to prevent stuck loader
        if (document.readyState === 'complete') {
          setTimeout(dismiss, 800);
        } else {
          window.addEventListener('load', function() {
            setTimeout(dismiss, 500);
          });
          setTimeout(dismiss, 1200);
        }
      })();
    </script>
